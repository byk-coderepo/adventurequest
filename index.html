<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Disney Springs Adventure Quest 🏰</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif; background: #F5F5F7; min-height: 100vh; }
  #app { max-width: 430px; margin: 0 auto; min-height: 100vh; }

  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(0,0,0,0.07);
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-title-sub { font-size: 10px; font-weight: 800; color: #8E8E93; letter-spacing: 0.1em; text-transform: uppercase; }
  .header-title-main { font-size: 18px; font-weight: 800; color: #1C1C1E; margin-top: 1px; }
  .detective-btn {
    background: #007AFF; color: white; border: none;
    border-radius: 20px; padding: 7px 14px;
    font-size: 13px; font-weight: 700; cursor: pointer;
    font-family: inherit; display: flex; align-items: center; gap: 5px;
    transition: transform 0.12s;
  }
  .detective-btn:active { transform: scale(0.95); }
  .detective-btn.all-found { background: linear-gradient(135deg, #FF9500, #FF6B00); }

  .card {
    margin: 14px 12px 0;
    background: white; border-radius: 22px; overflow: hidden;
    box-shadow: 0 2px 16px rgba(0,0,0,0.09);
    animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(24px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .loc-header { padding: 22px 20px 18px; }
  .loc-badge { font-size: 10px; font-weight: 800; letter-spacing: 0.12em; color: rgba(255,255,255,0.8); margin-bottom: 8px; text-transform: uppercase; }
  .loc-name { font-size: 24px; font-weight: 900; color: white; line-height: 1.2; }

  .map-container { height: 210px; background: #E5E5EA; position: relative; overflow: hidden; }
  .map-container iframe { border: none; display: block; width: 100%; height: 210px; }
  .map-overlay {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.15));
    height: 50px; pointer-events: none;
  }
  .map-btns { position: absolute; bottom: 10px; right: 10px; display: flex; gap: 7px; }
  .map-btn {
    background: white; border-radius: 10px; padding: 5px 11px;
    font-size: 12px; font-weight: 700; text-decoration: none;
    box-shadow: 0 1px 8px rgba(0,0,0,0.18); font-family: inherit;
    white-space: nowrap;
  }
  .map-btn.primary { color: #007AFF; }
  .map-btn.secondary { color: #636366; }

  .content { padding: 20px 20px 24px; }
  .description { font-size: 15px; line-height: 1.65; color: #3C3C43; margin-bottom: 20px; }
  .section-label { font-size: 11px; font-weight: 800; color: #8E8E93; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; }

  .journal-wrap { margin-bottom: 20px; }
  .journal-input {
    width: 100%; border: 1.5px solid #E5E5EA; border-radius: 14px;
    padding: 12px 14px; font-size: 15px; font-family: inherit;
    resize: none; outline: none; color: #1C1C1E; line-height: 1.5;
    transition: border-color 0.15s; background: #FAFAFA;
  }

  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn {
    border-radius: 16px; padding: 15px 18px; font-size: 15px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: space-between;
    font-family: inherit; transition: transform 0.12s; border: none; width: 100%;
  }
  .choice-btn:active { transform: scale(0.97); }

  .cta-btn {
    width: 100%; border: none; border-radius: 16px; padding: 16px;
    font-size: 16px; font-weight: 800; cursor: pointer; font-family: inherit;
    color: white; transition: transform 0.12s;
  }
  .cta-btn:active { transform: scale(0.97); }

  .done-celebration { text-align: center; padding: 8px 0 22px; }
  .done-emoji { font-size: 52px; margin-bottom: 10px; animation: pop 0.5s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes pop { from { transform: scale(0.4); opacity:0; } to { transform: scale(1); opacity:1; } }
  .done-title { font-size: 22px; font-weight: 900; color: #1C1C1E; margin-bottom: 6px; }
  .done-sub { font-size: 14px; color: #8E8E93; line-height: 1.5; }
  .back-btn {
    width: 100%; background: #007AFF; color: white; border: none;
    border-radius: 16px; padding: 15px; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: transform 0.12s; margin-top: 16px;
  }
  .back-btn:active { transform: scale(0.97); }

  .bottom-link { text-align: center; padding: 14px 0 32px; }
  .bottom-link a { font-size: 13px; color: #007AFF; text-decoration: none; font-weight: 600; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200;
    display: none; align-items: flex-end;
    opacity: 0; transition: opacity 0.25s;
  }
  .modal-backdrop.open { opacity: 1; }
  .modal-sheet {
    background: white; border-radius: 22px 22px 0 0;
    padding: 12px 20px 40px; width: 100%; max-width: 430px; margin: 0 auto;
    transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.34,1.2,0.64,1);
  }
  .modal-backdrop.open .modal-sheet { transform: translateY(0); }
  .drag-handle { width: 36px; height: 4px; background: #E5E5EA; border-radius: 2px; margin: 8px auto 20px; }
  .modal-title { font-size: 20px; font-weight: 900; color: #1C1C1E; margin-bottom: 4px; }
  .modal-sub { font-size: 14px; color: #8E8E93; margin-bottom: 20px; line-height: 1.4; }
  .bonus-items { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .bonus-item {
    display: flex; align-items: center; gap: 14px;
    border-radius: 14px; padding: 13px 16px; cursor: pointer;
    border: 1.5px solid transparent; background: #F2F2F7;
    font-family: inherit; width: 100%; text-align: left; transition: background 0.15s, border-color 0.15s;
  }
  .bonus-item.checked { background: #F0F8FF; border-color: #007AFF; }
  .checkbox {
    width: 24px; height: 24px; border-radius: 7px; flex-shrink: 0;
    background: white; border: 1.5px solid #C7C7CC;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .bonus-item.checked .checkbox { background: #007AFF; border-color: #007AFF; }
  .checkmark { color: white; font-size: 13px; font-weight: 900; display: none; }
  .bonus-item.checked .checkmark { display: block; }
  .bonus-label { font-size: 15px; color: #1C1C1E; font-weight: 600; }
  .prize-banner {
    background: linear-gradient(135deg, #FF9500, #FF6B00);
    border-radius: 16px; padding: 16px; text-align: center; margin-bottom: 16px;
    animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
  }
  .prize-title { font-size: 17px; font-weight: 900; color: white; margin-bottom: 3px; }
  .prize-sub { font-size: 13px; color: rgba(255,255,255,0.9); }
  .close-modal-btn {
    width: 100%; background: #F2F2F7; color: #1C1C1E; border: none;
    border-radius: 16px; padding: 14px; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
</style>
</head>
<body>
<div id="app">
  <header class="header">
    <div>
      <div class="header-title-sub">🎂 Birthday Quest</div>
      <div class="header-title-main">Disney Springs 🏰</div>
    </div>
    <button class="detective-btn" id="detective-btn" onclick="openBonus()">
      🔍 Detective <span id="bonus-count">0</span>/4
    </button>
  </header>

  <div id="main-content"></div>

  <div class="bottom-link">
    <a href="https://www.disneysprings.com/disney-springs-map/" target="_blank">View Full Disney Springs Map ↗</a>
  </div>
</div>

<div class="modal-backdrop" id="bonus-modal" onclick="closeBonusBackdrop(event)">
  <div class="modal-sheet">
    <div class="drag-handle"></div>
    <div class="modal-title">🔍 Disney Detective</div>
    <div class="modal-sub">Spot all 4 items while exploring and win a Disney t-shirt! 🎉</div>
    <div class="bonus-items" id="bonus-list"></div>
    <div id="prize-area"></div>
    <button class="close-modal-btn" onclick="closeBonus()">Done</button>
  </div>
</div>

<script>
const LOCATIONS = {
  start: {
    id: 'start',
    name: 'World of Disney',
    badge: 'YOUR ADVENTURE BEGINS',
    emoji: '🏰',
    gradient: 'linear-gradient(135deg, #1D7BEB 0%, #0A4F9E 100%)',
    accent: '#1D7BEB',
    lat: 28.37135, lng: -81.51935,
    osmBbox: '-81.5215,28.3695,-81.5170,28.3730',
    appleMaps: 'https://maps.apple.com/?q=World+of+Disney+Disney+Springs&ll=28.37135,-81.51935&z=17',
    googleMaps: 'https://www.google.com/maps/search/World+of+Disney+Disney+Springs/@28.37135,-81.51935,17z',
    description: 'Welcome, Birthday Girl! 🎉 Your quest starts here. Head inside and look around the souvenir shop — you spot two amazing things calling your name...',
    type: 'choice',
    choiceLabel: "This or That — pick one!",
    choices: [
      { label: 'Loungefly Backpack', emoji: '🎒', next: 'gideons' },
      { label: 'Minnie Ears', emoji: '✨', next: 'summerhouse' }
    ]
  },
  gideons: {
    id: 'gideons',
    name: "Gideon's Bakehouse",
    badge: 'PATH 1 · COOKIE TIME',
    emoji: '🍪',
    gradient: 'linear-gradient(135deg, #FF9500 0%, #D4700A 100%)',
    accent: '#FF9500',
    lat: 28.37090, lng: -81.51710,
    osmBbox: '-81.5190,28.3685,-81.5150,28.3725',
    appleMaps: "https://maps.apple.com/?q=Gideon's+Bakehouse+Disney+Springs&ll=28.37090,-81.51710&z=17",
    googleMaps: "https://www.google.com/maps/search/Gideon's+Bakehouse+Disney+Springs/@28.37090,-81.51710,17z",
    description: "Look at all the giant cookies! Pick the one that looks the absolute yummiest — you get to take it with you. 😋",
    type: 'journal+choice',
    journalLabel: '🍪 Which cookie did you choose?',
    journalHint: 'Write the cookie name here...',
    choiceLabel: "Cookie secured! What's next?",
    choices: [
      { label: 'New Treat', emoji: '✨', next: 'sephora' },
      { label: 'Dole Whip', emoji: '🍦', next: 'goofy' }
    ]
  },
  summerhouse: {
    id: 'summerhouse',
    name: 'Summer House on the Lake',
    badge: 'PATH 2 · COOKIE BAR',
    emoji: '🌊',
    gradient: 'linear-gradient(135deg, #2ECC71 0%, #1A8A4C 100%)',
    accent: '#2ECC71',
    lat: 28.37025, lng: -81.51550,
    osmBbox: '-81.5175,28.3682,-81.5133,28.3720',
    appleMaps: 'https://maps.apple.com/?q=Summer+House+on+the+Lake+Disney+Springs&ll=28.37025,-81.51550&z=17',
    googleMaps: 'https://www.google.com/maps/search/Summer+House+on+the+Lake+Disney+Springs/@28.37025,-81.51550,17z',
    description: 'Check out the cookie bar! Which cookie would you try first? Pick your cookie and take it with you!',
    type: 'journal+choice',
    journalLabel: '🍪 Which cookie did you pick?',
    journalHint: 'Write the cookie name here...',
    choiceLabel: "Cookie in hand! What's next?",
    choices: [
      { label: 'New Treat (your pick!)', emoji: '✨', next: 'sephora' },
      { label: 'Dole Whip', emoji: '🍦', next: 'goofy' }
    ]
  },
  sephora: {
    id: 'sephora',
    name: 'Sephora',
    badge: 'TREAT TIME · BEAUTY',
    emoji: '💄',
    gradient: 'linear-gradient(135deg, #A855F7 0%, #7C3AED 100%)',
    accent: '#A855F7',
    lat: 28.37140, lng: -81.51672,
    osmBbox: '-81.5187,28.3694,-81.5147,28.3730',
    appleMaps: 'https://maps.apple.com/?q=Sephora+Disney+Springs&ll=28.37140,-81.51672&z=17',
    googleMaps: 'https://www.google.com/maps/search/Sephora+Disney+Springs/@28.37140,-81.51672,17z',
    description: 'Explore the colorful displays! What sparkly item or color catches your eye? ✨ Then find a Summer Fridays lip balm to complete your journey.',
    type: 'journal+complete',
    journalLabel: '✨ What sparkly item caught your eye?',
    journalHint: 'Describe what you spotted...'
  },
  goofy: {
    id: 'goofy',
    name: "Goofy's Candy Company",
    badge: 'TREAT TIME · SWEETS',
    emoji: '🍬',
    gradient: 'linear-gradient(135deg, #F43F5E 0%, #BE123C 100%)',
    accent: '#F43F5E',
    lat: 28.37105, lng: -81.51820,
    osmBbox: '-81.5202,28.3691,-81.5162,28.3728',
    appleMaps: "https://maps.apple.com/?q=Goofy's+Candy+Co+Disney+Springs&ll=28.37105,-81.51820&z=17",
    googleMaps: "https://www.google.com/maps/search/Goofy's+Candy+Company+Disney+Springs/@28.37105,-81.51820,17z",
    description: "Look around at all the candy! If you could make your own candy, what would it be called? 🍭 Then find a bag of candy to complete your journey.",
    type: 'journal+complete',
    journalLabel: '🍭 What would you name your candy?',
    journalHint: 'Your candy name here...'
  }
};

const BONUS_ITEMS = [
  { id: 'lego', label: 'A giant LEGO sculpture', emoji: '🧱' },
  { id: 'statue', label: 'A Disney character statue', emoji: '🗿' },
  { id: 'balloon', label: 'A balloon seller', emoji: '🎈' },
  { id: 'music', label: 'A store playing Disney music outside', emoji: '🎵' }
];

let state = { page: 'start', journal: {}, bonus: {}, done: false };

function go(to) { state.page = to; state.done = false; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function completeMission() { state.done = true; render(); }
function goBack() { go('start'); }

function osmUrl(loc) {
  return `https://www.openstreetmap.org/export/embed.html?bbox=${loc.osmBbox}&layer=mapnik&marker=${loc.lat},${loc.lng}`;
}

function render() {
  const loc = LOCATIONS[state.page];
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const directionsUrl = isIOS ? loc.appleMaps : loc.googleMaps;

  let journalHTML = '';
  if (!state.done && (loc.type === 'journal+choice' || loc.type === 'journal+complete')) {
    journalHTML = `
      <div class="journal-wrap">
        <div class="section-label">${loc.journalLabel}</div>
        <textarea class="journal-input" id="journal-${loc.id}"
          placeholder="${loc.journalHint}" rows="2"
          onfocus="this.style.borderColor='${loc.accent}'"
          onblur="this.style.borderColor='#E5E5EA';state.journal['${loc.id}']=this.value"
        >${state.journal[loc.id] || ''}</textarea>
      </div>`;
  }

  let choicesHTML = '';
  if (!state.done && (loc.type === 'choice' || loc.type === 'journal+choice')) {
    choicesHTML = `
      <div class="section-label">${loc.choiceLabel}</div>
      <div class="choices">
        ${loc.choices.map((c, i) => `
          <button class="choice-btn"
            style="${i===0
              ? `background:${loc.gradient};color:white;`
              : `background:white;color:${loc.accent};border:1.5px solid ${loc.accent};`}"
            onclick="go('${c.next}')">
            <span>${c.emoji} ${c.label}</span>
            <span style="font-size:18px;opacity:0.75">→</span>
          </button>`).join('')}
      </div>`;
  }

  let ctaHTML = '';
  if (!state.done && loc.type === 'journal+complete') {
    ctaHTML = `<button class="cta-btn" style="background:${loc.gradient}" onclick="completeMission()">✓ Mission Complete!</button>`;
  }

  let doneHTML = '';
  if (state.done) {
    doneHTML = `
      <div class="done-celebration">
        <div class="done-emoji">🎉</div>
        <div class="done-title">Path Complete!</div>
        <div class="done-sub">You crushed it! Head back to Start<br/>and try the other path.</div>
      </div>
      <button class="back-btn" onclick="goBack()">↩ Back to Start</button>`;
  }

  document.getElementById('main-content').innerHTML = `
    <div class="card">
      <div class="loc-header" style="background:${loc.gradient}">
        <div class="loc-badge">${loc.badge}</div>
        <div class="loc-name">${loc.emoji} ${loc.name}</div>
      </div>
      <div class="map-container">
        <iframe src="${osmUrl(loc)}" title="Map of ${loc.name}" loading="lazy" scrolling="no"></iframe>
        <div class="map-overlay"></div>
        <div class="map-btns">
          <a class="map-btn secondary" href="https://www.disneysprings.com/disney-springs-map/" target="_blank">Springs Map</a>
          <a class="map-btn primary" href="${directionsUrl}" target="_blank">Directions ↗</a>
        </div>
      </div>
      <div class="content">
        ${!state.done ? `<p class="description">${loc.description}</p>` : ''}
        ${journalHTML}
        ${choicesHTML}
        ${ctaHTML}
        ${doneHTML}
      </div>
    </div>`;
}

function renderBonus() {
  const count = BONUS_ITEMS.filter(b => state.bonus[b.id]).length;
  document.getElementById('bonus-count').textContent = count;
  document.getElementById('detective-btn').className = 'detective-btn' + (count === 4 ? ' all-found' : '');
  document.getElementById('bonus-list').innerHTML = BONUS_ITEMS.map(item => `
    <button class="bonus-item ${state.bonus[item.id] ? 'checked' : ''}" onclick="toggleBonus('${item.id}')">
      <div class="checkbox"><span class="checkmark">✓</span></div>
      <span class="bonus-label">${item.emoji} ${item.label}</span>
    </button>`).join('');
  document.getElementById('prize-area').innerHTML = count === 4 ? `
    <div class="prize-banner">
      <div class="prize-title">🎉 You found them all!</div>
      <div class="prize-sub">You win a Disney t-shirt!</div>
    </div>` : '';
}

function toggleBonus(id) { state.bonus[id] = !state.bonus[id]; renderBonus(); }

function openBonus() {
  renderBonus();
  const m = document.getElementById('bonus-modal');
  m.style.display = 'flex';
  requestAnimationFrame(() => m.classList.add('open'));
}
function closeBonus() {
  const m = document.getElementById('bonus-modal');
  m.classList.remove('open');
  setTimeout(() => m.style.display = 'none', 300);
}
function closeBonusBackdrop(e) { if (e.target === document.getElementById('bonus-modal')) closeBonus(); }

render();
</script>
</body>
</html>
